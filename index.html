<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor de Escalas</title>
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/fretboard.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/themes.css">
</head>

<body class="p-6 max-w-[1400px] mx-auto relative min-h-screen" data-skin="light">

    <div id="view-modals"></div>
    <div id="help-container"></div>
    
    <div id="view-topbar" class="relative flex flex-wrap items-center justify-between mb-4 z-[100] gap-4 w-full"></div>
    
    <div id="secondary-controls" class="flex flex-wrap justify-center items-center mb-8 relative z-50 hidden"></div>
    
    <div id="positions-container" class="flex flex-wrap justify-start gap-4 md:gap-6 mb-8" dir="ltr"></div>

    <div class="mb-8 overflow-x-auto hide-scrollbar">
         <div id="main-fretboard-container" class="min-w-[900px] flex flex-col relative">
            <div id="view-floating-play" class="floating-play-btn flex gap-4"></div>
            <div id="main-fretboard" dir="ltr"></div>
        </div>
    </div>

    <script src="js/ui/views/modals.js"></script>
    <script src="js/ui/views/topbar.js"></script>
    <script src="js/ui/views/secondary.js"></script>
    <script src="js/ui/views/floating.js"></script>

    <script src="js/data/flags.js"></script>
    <script src="js/data/consts.js"></script>
    <script src="js/music/audio.js"></script>
    <script src="js/music/theory.js"></script>
    
    <script src="js/music/sequencer.js"></script>
    <script src="js/music/backingtrack.js"></script>
    
    <script src="js/music/pitch.js"></script> 
    <script src="js/music/mic.js"></script>
    
    <script src="js/ui/i18n.js"></script>
    <script src="js/ui/render.js"></script>
    <script src="js/ui/layout.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/ui/mic_feedback.js"></script>
    <script src="js/ui/mic_score.js"></script>
    <script src="js/ui/mic_ui.js"></script>
    <script src="js/ui/observer.js"></script>
    <script src="js/ui/events.js"></script>
    <script src="js/core/stats.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
